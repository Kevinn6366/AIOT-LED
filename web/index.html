<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZYBO Z7-20 · 灯光控制</title>
  <link rel="stylesheet" href="/panel.css?v=rgb1">
  <script src="/main.js?v=rgb1" defer></script>
</head>
<body>
  <header><div class="bar"><strong>AIOT-LED</strong><span>设备控制台</span><code>ZYBO Z7-20</code></div></header>
  <main>
    <div class="heading"><h1>灯光控制</h1><span id="link" class="link">正在读取 PL</span></div>
    <p id="host-tools" hidden><a href="/boot">查看 COM3 启动监视</a></p>
    <section aria-labelledby="pl-title">
      <div class="section-head"><h2 id="pl-title">PL 数字量 I/O</h2><span id="clock">等待采样</span></div>
      <div class="scroll"><table>
        <thead><tr><th scope="col">通道</th><th scope="col">拨杆输入</th><th scope="col">灯输出</th><th scope="col">控制方式</th></tr></thead>
        <tbody id="channels"></tbody>
      </table></div>
      <p class="note">选择「跟随拨杆」时，1 为亮、0 为灭。选择「开灯」或「关灯」可单独接管该路。</p>
    </section>
    <section aria-labelledby="rgb-title">
      <div class="section-head"><h2 id="rgb-title">RGB 彩灯</h2><code>PL / PWM</code></div>
      <div class="scroll"><table>
        <thead><tr><th scope="col">通道</th><th scope="col">设定颜色</th><th scope="col">使能状态</th><th scope="col">操作</th></tr></thead>
        <tbody id="rgb-channels"></tbody>
      </table></div>
      <div class="ps"><strong>神光同步</strong><span id="sync-status" role="status">等待采样</span>
        <button id="rgb-sync" type="button" aria-pressed="false" disabled>开启同步</button></div>
    </section>
    <section aria-labelledby="ps-title">
      <div class="section-head"><h2 id="ps-title">PS 指示灯</h2><code>MIO7</code></div>
      <div class="ps"><strong>LD4</strong><span id="ps-result" role="status">等待操作</span><div class="group"><button data-ps="1">开灯</button><button data-ps="0">关灯</button></div></div>
    </section>
    <p id="error" role="status"></p>
    <section aria-labelledby="gpt-title">
      <div class="section-head"><h2 id="gpt-title">英文台词续写</h2><code>PL / ZyboGPT</code></div>
      <form id="gpt-form">
        <label>英文开头 <input name="prompt" value="ROMEO:" maxlength="96" required></label>
        <label>采样种子 <input name="seed" type="number" min="1" max="4294967295" value="3735928559" required></label>
        <button disabled>生成续文</button>
      </form>
      <pre id="gpt-output" aria-label="生成文本"></pre>
      <p class="note" id="gpt-status" role="status">检测推理核…</p>
    </section>
    <section aria-labelledby="boot-title">
      <div class="section-head"><h2 id="boot-title">系统状态</h2><code>SD / PetaLinux</code></div>
      <p class="note" id="boot-status">正在读取启动状态…</p>
      <div class="ps" id="restart-tools" hidden><button type="button" id="restart" disabled>重启开发板</button><span id="restart-result" role="status"></span></div>
    </section>
  </main>
</body>
</html>
